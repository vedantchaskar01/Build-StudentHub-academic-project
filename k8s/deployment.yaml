apiVersion: apps/v1
kind: Deployment
metadata:
  name: studenthub-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studenthub-backend
  template:
    metadata:
      labels:
        app: studenthub-backend
    spec:
      containers:
        - name: backend
          image: studenthub-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
